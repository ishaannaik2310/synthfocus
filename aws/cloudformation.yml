AWSTemplateFormatVersion: "2010-09-09"
Description: "SynthFocus Production Infrastructure on AWS ECS Fargate, ALB with 180s SSE Idle Timeout, ECR, and Secrets Manager"

Parameters:
  GoogleApiKey:
    Type: String
    NoEcho: true
    Description: "Google Gemini API Key for Synthetic Persona Simulation"
    MinLength: 1

  GeminiModel:
    Type: String
    Default: "gemini-3.5-flash-lite"
    Description: "Gemini Model identifier"

  BackendCpu:
    Type: String
    Default: "512"
    Description: "Backend Fargate Task CPU units (512 = 0.5 vCPU)"

  BackendMemory:
    Type: String
    Default: "1024"
    Description: "Backend Fargate Task Memory in MiB (1024 = 1 GB)"

  FrontendCpu:
    Type: String
    Default: "512"
    Description: "Frontend Fargate Task CPU units (512 = 0.5 vCPU)"

  FrontendMemory:
    Type: String
    Default: "1024"
    Description: "Frontend Fargate Task Memory in MiB (1024 = 1 GB)"

Resources:
  # ========================================================
  # 1. NETWORKING (VPC, Subnets, Internet Gateway, Routes)
  # ========================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: synthfocus-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: synthfocus-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: synthfocus-public-rt

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: synthfocus-public-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: synthfocus-public-subnet-2

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

  # ========================================================
  # 2. SECURITY GROUPS
  # ========================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow public HTTP ingress to SynthFocus ALB"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: synthfocus-alb-sg

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow ALB ingress to SynthFocus ECS containers"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: "Inbound traffic from ALB to Backend"
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: "Inbound traffic from ALB to Frontend"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: "Outbound internet access for Gemini API and packages"
      Tags:
        - Key: Name
          Value: synthfocus-ecs-sg

  # ========================================================
  # 3. AMAZON ECR REPOSITORIES
  # ========================================================
  BackendEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: synthfocus-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  FrontendEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: synthfocus-frontend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  # ========================================================
  # 4. SECRETS MANAGER & CLOUDWATCH LOGS
  # ========================================================
  GoogleApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: synthfocus/google-api-key
      Description: "Google Gemini API Key for SynthFocus simulations"
      SecretString: !Ref GoogleApiKey

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/synthfocus-backend
      RetentionInDays: 14

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/synthfocus-frontend
      RetentionInDays: 14

  # ========================================================
  # 5. IAM ROLES FOR ECS EXECUTION & TASKS
  # ========================================================
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: synthfocus-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleApiKeySecret

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: synthfocus-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ========================================================
  # 6. APPLICATION LOAD BALANCER (ALB) WITH 180s IDLE TIMEOUT
  # ========================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: synthfocus-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        # CRITICAL: ALB idle timeout set to 180 seconds to protect 80-second SSE simulation streams!
        - Key: idle_timeout.timeout_seconds
          Value: "180"

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-synthfocus-backend
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: tg-synthfocus-frontend
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  AlbBackendRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbHttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - "/api/*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ========================================================
  # 7. ECS CLUSTER & TASK DEFINITIONS
  # ========================================================
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: synthfocus-cluster

  # Backend Task Definition (Single Instance - DesiredCount: 1)
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: synthfocus-backend-task
      Cpu: !Ref BackendCpu
      Memory: !Ref BackendMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: synthfocus-backend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/synthfocus-backend:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Secrets:
            - Name: GOOGLE_API_KEY
              ValueFrom: !Ref GoogleApiKeySecret
          Environment:
            - Name: GEMINI_MODEL
              Value: !Ref GeminiModel
            - Name: BATCH_SIZE
              Value: "2"
            - Name: BATCH_SLEEP_SECONDS
              Value: "13"
            - Name: MAX_DAILY_SIMULATIONS
              Value: "120"
            - Name: RATE_LIMIT_SIMULATIONS_PER_HOUR
              Value: "10"
            - Name: MAX_BRIEF_LENGTH
              Value: "5000"
            - Name: MIN_BRIEF_LENGTH
              Value: "10"
            - Name: TRUSTED_PROXY_HOPS
              Value: "1"
            - Name: CORS_ORIGINS
              Value: "*"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  # Frontend Task Definition
  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: synthfocus-frontend-task
      Cpu: !Ref FrontendCpu
      Memory: !Ref FrontendMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: synthfocus-frontend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/synthfocus-frontend:latest"
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # ========================================================
  # 8. ECS FARGATE SERVICES
  # ========================================================
  # IMPORTANT: DesiredCount is strictly 1 to enforce single-instance Gemini rate limit protection
  BackendService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbBackendRule
    Properties:
      ServiceName: synthfocus-backend-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref BackendTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: synthfocus-backend
          ContainerPort: 8000
          TargetGroupArn: !Ref BackendTargetGroup

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbHttpListener
    Properties:
      ServiceName: synthfocus-frontend-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref FrontendTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: synthfocus-frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroup

Outputs:
  ApplicationUrl:
    Description: "SynthFocus Live Web Application URL (Application Load Balancer)"
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: synthfocus-app-url

  AlbDnsName:
    Description: "Application Load Balancer DNS Name"
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  BackendEcrRepositoryUri:
    Description: "Backend Amazon ECR Repository URI"
    Value: !GetAtt BackendEcrRepository.RepositoryUri

  FrontendEcrRepositoryUri:
    Description: "Frontend Amazon ECR Repository URI"
    Value: !GetAtt FrontendEcrRepository.RepositoryUri

  EcsClusterName:
    Description: "ECS Cluster Name"
    Value: !Ref EcsCluster

  BackendServiceName:
    Description: "Backend ECS Service Name"
    Value: !GetAtt BackendService.Name

  FrontendServiceName:
    Description: "Frontend ECS Service Name"
    Value: !GetAtt FrontendService.Name
