name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11 & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest suite
        env:
          GOOGLE_API_KEY: "ci-placeholder"
        run: pytest backend/tests/ -v

  frontend:
    name: Frontend (Node LTS, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint source code
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E Smoke Tests (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build

      - name: Run Playwright smoke tests (Mocked SSE)
        working-directory: frontend
        run: npx playwright test tests/smoke.spec.ts

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker Build & Health Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Backend Docker image
        run: docker build -t synthfocus-backend:test ./backend

      - name: Build Frontend Docker image
        run: docker build --build-arg NEXT_PUBLIC_API_URL="" -t synthfocus-frontend:test ./frontend

      - name: Verify Backend container health endpoint
        run: |
          docker run -d --name backend-health-check -p 8000:8000 -e GOOGLE_API_KEY=ci-placeholder synthfocus-backend:test
          # Wait briefly for uvicorn startup and probe /api/health
          sleep 3
          response=$(curl --fail --retry 5 --retry-connrefused --retry-delay 2 -s http://localhost:8000/api/health)
          echo "Health endpoint response: $response"
          echo "$response" | grep -q '"status":"ok"'
          docker stop backend-health-check
          docker rm backend-health-check

  security:
    name: Security Audits & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python production dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Audit Node production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
